<div class="prose">         <span class="source-page" style="background-color:#000000;color:inherit"> <span class="source-ink" style="color:#ffffff">    <span class="dialogue"><span class="dropcap"><span class="strong">猫</span></span>：我错了！我错了！<span class="paragraph-break"></span><span class="paragraph-indent" aria-hidden="true"></span>狄利克雷：你已经辜负了你的使命，也让我的名声尽失。如今我要剥夺你说话的权利，并遣返你回人间。<span class="paragraph-break"></span><span class="paragraph-indent" aria-hidden="true"></span>猫：不要！求求您了！您让我再给您奏几曲吧……或者至少还我奖章，让我有家可归吧……<span class="paragraph-break"></span><span class="paragraph-indent" aria-hidden="true"></span>狄利克雷：没门！给我出去！<span class="paragraph-break"></span><span class="paragraph-indent" aria-hidden="true"></span>猫：我们就要这样永别了么，我的朋友……<span class="paragraph-break"></span><span class="paragraph-indent" aria-hidden="true"></span>（天庭的大门把猫永远地、彻底地关在了外面。）<span class="paragraph-break"></span><span class="paragraph-indent" aria-hidden="true"></span>（猫突然醒来。）<span class="paragraph-break"></span><span class="paragraph-indent" aria-hidden="true"></span>猫：喵！喵……<span class="paragraph-break"></span><span class="paragraph-indent" aria-hidden="true"></span><span class="paragraph-break"></span><span class="paragraph-indent" aria-hidden="true"></span><span class="env-center"> <span class="illustration svg-illustration" data-source-pdf="trebleclef.preview.pdf"><img src="assets/pdf-svg/asset-c140cea8e6e6-1.svg" width="17" height="38" alt="trebleclef.preview，第 1 页" loading="lazy"><a href="assets/asset-c140cea8e6e6.pdf" target="_blank" rel="noopener">原 PDF · trebleclef.preview ↗</a></span> </span><span class="paragraph-break"></span><span class="paragraph-indent" aria-hidden="true"></span></span><span class="paragraph-break"></span><span class="paragraph-indent" aria-hidden="true"></span></span></span></div>

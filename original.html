<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寻找狄利克雷 · 中文版</title>
  <meta name="description" content="《寻找狄利克雷》中文版，保留原书排版的在线阅读。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23212724'/%3E%3Ctext x='9' y='25' font-family='serif' font-size='26' fill='white'%3EL%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; color: #eee; background: #202422; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    button, select, a { font: inherit; }
    a { color: inherit; text-underline-offset: .2em; }
    button, select { min-height: 40px; border: 1px solid #59635c; border-radius: 5px; color: #eee; background: #303731; padding: 6px 12px; }
    button { cursor: pointer; }
    button:hover { background: #414d43; }
    :focus-visible { outline: 3px solid #dfc77e; outline-offset: 3px; }
    header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid #414a43; }
    h1 { font: 600 20px/1.4 "Noto Serif CJK SC", "Songti SC", SimSun, serif; margin: 0; white-space: nowrap; }
    .edition { font-size: 14px; color: #b3bdb5; margin-left: 10px; font-family: system-ui, sans-serif; font-weight: 400; }
    .toolbar { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .toolbar a { font-size: 14px; }
    select { max-width: min(36vw, 280px); }
    main { flex: 1; min-height: 0; overflow: auto; padding: 20px; position: relative; background: #303330; }
    #paper { margin: 0 auto; position: relative; width: fit-content; box-shadow: 0 4px 24px #0005; }
    canvas { display: block; }
    #status { text-align: center; margin: 12px; }
    #status:empty { display: none; }
    .paging { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 7px; flex-wrap: wrap; border-bottom: 1px solid #414a43; }
    input { width: 64px; padding: 6px; font: inherit; color: #eee; background: #303731; border: 1px solid #59635c; border-radius: 5px; }
    footer { display: flex; gap: 16px; justify-content: space-between; padding: 6px 20px; font-size: 14px; color: #b3bdb5; border-top: 1px solid #414a43; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media(max-width: 700px) {
      header { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
      h1 { font-size: 18px; }
      .toolbar { width: 100%; margin: 0; gap: 8px; }
      select { flex: 1; min-width: 0; max-width: none; }
      footer { padding: 6px 12px; font-size: 13px; }
      .page-total { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>寻找狄利克雷<span class="edition">中文版</span></h1>
    <nav class="toolbar" aria-label="阅读导航">
      <label for="chapter" class="sr-only">跳转章节</label>
      <select id="chapter" disabled><option>章节目录</option></select>
      <button type="button" id="cover">封面</button>
      <a href="assets/book-zh.pdf" target="_blank" rel="noopener">打开原书 ↗</a>
    </nav>
  </header>
  <div class="paging" aria-label="书页控制">
    <button id="prev" type="button" disabled>上一页</button>
    <form id="page-form"><label for="page-number">第 </label><input id="page-number" type="number" min="1" max="268" value="13" aria-label="页码"><span> / 268 页</span><button type="submit">跳转</button></form>
    <button id="next" type="button" disabled>下一页</button>
    <label for="zoom" class="sr-only">缩放</label>
    <select id="zoom"><option value="fit">适合宽度</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select>
  </div>
  <main id="reading-area" aria-label="原书阅读区" tabindex="0">
    <p id="status" role="status">正在载入书页…</p>
    <div id="paper"><canvas id="page-canvas" aria-label="书页原版图像"></canvas></div>
  </main>
  <footer>
    <span>无法显示书页？<a href="assets/book-zh.pdf" target="_blank" rel="noopener">直接打开 PDF</a></span>
    <span class="page-total">原书排版 · 268 页</span>
  </footer>
  <noscript>章节菜单需要 JavaScript，原书仍可直接阅读。</noscript>
  <script src="book.js"></script>
  <script type="module" src="viewer.mjs"></script>
</body>
</html>
